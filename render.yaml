# Render Blueprint — free web service for the PDF Library backend.
# Render dashboard → New → Blueprint → select this repo. Then fill the secret env vars.
services:
  - type: web
    name: pdf-library-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false        # enter the NEW (rotated) token in the dashboard
      - key: CHANNEL_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false        # https://<your-service>.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_CHAT_ID
        sync: false          # your Telegram user id (from @userinfobot)
      - key: LARGE_FILES_ENABLED
        value: "false"       # manual delivery of 20 MB+ books
      - key: ADMIN_KEY
        generateValue: true   # use it for /admin/unlocks?key=...
